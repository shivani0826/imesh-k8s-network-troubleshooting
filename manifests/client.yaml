apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: imesh-client:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: FRONTEND_URL
              value: "http://frontend:8080"
